project_name: "oscars-award-wins"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:
  # Academy Awards nominations + winners, 1st (1927/28) .. 98th (2025) ceremonies.
  # NOTE: the file is TAB-SEPARATED despite the .csv extension — ingest_oscars()
  # reads it with sep='\t'. Facts derive from the AMPAS Awards Database + IMDb.
  oscars:
    url: https://raw.githubusercontent.com/DLu/oscar_data/main/oscars.csv
    type: csv
    tab_separated: true   # read with sep='\t' (see src/ingest.ingest_oscars)
    rate_limit_seconds: 1.0

  # TMDB (The Movie Database) — film GENRE enrichment for the major-award
  # winners. Matched by IMDb id (/3/find/{imdb_id}?external_source=imdb_id),
  # with a title+year search fallback. API key lives in the GITIGNORED .env as
  # TMDB_API_KEY (never committed). Primary genre only (genres[0]). Per-film
  # JSON cached under data/raw/tmdb/ so re-runs are offline.
  # Attribution (required): "This product uses the TMDB API but is not endorsed
  # or certified by TMDB."
  tmdb:
    url: https://api.themoviedb.org/3
    type: api
    api_key_env: TMDB_API_KEY   # read from gitignored .env, never committed
    rate_limit_seconds: 0.3

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true       # generate a column-description markdown alongside each export
  strip_pii_columns: []        # list column names to drop before packaging
